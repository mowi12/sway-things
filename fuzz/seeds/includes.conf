set $gap 8
include config.d/*.conf
include ~/.config/sway/sway-things/*.conf
include $XDG_CONFIG_HOME/sway/"my configs"/a.conf
include $DIR/[ab].conf
include $TWO
include /etc/sway/config.d/*
include missing.conf
include /dev/zero
include config.d/fifo
include config.d/a.conf
gaps inner $gap $from_a
#=> config.d/a.conf
set $from_a 4
include ../config
include b.conf
#=> config.d/b.conf
include a.conf
input type:touchpad tap enabled
#=> config.d/.hidden.conf
gaps outer 1
#=> sway-things/10-input.conf
input type:keyboard {
    xkb_layout us,de
}
#=> my configs/a.conf
seat * hide_cursor 1000
#=> /etc/sway/config.d/50-systemd-user.conf
exec systemctl --user import-environment
#=| /dev/zero
#=| config.d/fifo
