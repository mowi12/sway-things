input type:touchpad {
    tap enabled
    natural_scroll enabled
}
input "1267:12377:ELAN1300:00_04F3:3059_Touchpad"
{
    tap disabled
}
output HDMI-A-1 {
    mode 1920x1080@60Hz
    pos 0 0
}
seat seat0 {
    xcursor_theme Adwaita 24
}
bar {
    position top
    colors {
        background #000000
        statusline #ffffff
    }
}
mode resize {
    bindsym Left resize shrink width 10px
    bindsym Escape mode default
}
gaps \
    inner \
    6
}
input * {
    xkb_options caps:escape
