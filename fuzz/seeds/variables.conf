set $mod Mod4
set $mod_alt Mod1
set $term foot
set $command bindsym
$command $mod+Return exec $term
bindsym $mod_alt+x exec "echo $$HOME \$mod"
set $mod Mod1
set $empty
set $a a
set $a $a$a
set $quoted "a b" 'c d'
gaps inner $a
font pango:Noto Sans $undefined 11
output * bg ~/bg.png fill
for_window [app_id="$term"] floating enable
mode "$mod resize" {
    set $inside x
    bindsym h resize shrink width 10px
}
client.focused #4c7899 #285577 #ffffff \x41 \0 "\"quoted\""
