[files]
# data/man and data/completions: generated by crates/cli-docs from help texts that are checked in the Rust sources.
# ci/install: the OBS signing key in base64, a fixture of the install script's test.
extend-exclude = ["data/man/", "data/completions/", "ci/install/*.asc"]

[default]
locale = "en-us"

[default.extend-identifiers]
# Relm4, named in wiki/Architecture.md as the GUI library we don't use
Relm4 = "Relm4"
# gtk::accessible::Relation::LabelledBy, the ARIA relation aria-labelledby
LabelledBy = "LabelledBy"

[default.extend-words]
# systemd-localed, the D-Bus service for locale and keyboard layout
localed = "localed"
# rpmbuild -ba: build the source and the binary packages
ba = "ba"
