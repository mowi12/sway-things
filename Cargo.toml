[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/mowi12/sway-things"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every pure public function would need #[must_use]; that guards library APIs, and ours has no outside users.
must_use_candidate = "allow"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"

[workspace.dependencies]
anstream = "1"
anstyle = "1"
async-channel = "2"
async-io = "2"
async-process = "2"
clap = { version = "4", features = ["derive"] }
colorchoice-clap = "1"
futures-lite = { version = "2", default-features = false, features = ["std"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
notify = { version = "8", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }
regex = "1"
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
rustix = { version = "1", default-features = false, features = ["std", "system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
swayipc-types = { version = "2", default-features = false }
tempfile = "3"
toml_edit = "0.25"
