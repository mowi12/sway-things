[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/mowi12/sway-things"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every pure public function would need #[must_use]; that guards library APIs, and ours has no outside users.
must_use_candidate = "allow"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"

[workspace.dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
regex = "1"
rustix = { version = "1", default-features = false, features = ["std", "system"] }
tempfile = "3"
toml_edit = "0.25"
