version = 1

[[annotations]]
path = [
  "**.md",
  "**.yml",
  "**.yaml",
  "**.json",
  "**.toml",
  "Cargo.lock",
  "fuzz/Cargo.lock",
  "tools/requirements.*",
  "tools/binaries.txt",
  ".gitignore",
  ".gitattributes",
  ".editorconfig",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The gettext template and translations start with the header gettext writes.
[[annotations]]
path = "po/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The man pages and shell completions are generated by crates/cli-docs and kept as it writes them; the zsh completion
# must start with #compdef.
[[annotations]]
path = ["data/man/**", "data/completions/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Generated sway config files start with the fixed header of Sway Things, not with an SPDX header.
[[annotations]]
path = "ci/integration/generated/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = ["Contributor Covenant contributors", "2026 Sway Things contributors"]
SPDX-License-Identifier = "CC-BY-4.0"

# Fuzzer seeds are inputs, so they stay without a header.
[[annotations]]
path = "fuzz/seeds/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Screenshots of the app for the website, made by scripts/update-website-screenshots.sh.
[[annotations]]
path = "website/src/assets/screenshots/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Icons from Lucide (https://lucide.dev), recolored as GTK symbolic icons. The code icon is derived from Feather.
[[annotations]]
path = "crates/gui/resources/icons/scalable/actions/st-bug-symbolic.svg"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

[[annotations]]
path = "crates/gui/resources/icons/scalable/actions/st-globe-symbolic.svg"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

[[annotations]]
path = "crates/gui/resources/icons/scalable/actions/st-code-symbolic.svg"
precedence = "override"
SPDX-FileCopyrightText = ["2013-present Cole Bemis", "2026 Lucide Icons and Contributors"]
SPDX-License-Identifier = "ISC AND MIT"

# The AUR package files are 0BSD, as the AUR asks. .SRCINFO is written by makepkg and can't carry a header. (REUSE
# ignores the LICENSE file next to it, the license text for the AUR repository.)
[[annotations]]
path = "packaging/aur/**/.SRCINFO"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "0BSD"

# The public signing key of the OBS project, as OBS publishes it: a test fixture for the install script.
[[annotations]]
path = "ci/install/home_mowi12_sway-things.asc"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# swaync's own default config, as swaync 0.12.6 ships it: the base of the config Sway Things writes for swaync.
[[annotations]]
path = "crates/core/src/notifications/swaync-config.json"
precedence = "override"
SPDX-FileCopyrightText = "2021 Erik Reider and the SwayNotificationCenter contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# waybar's own default config and stylesheet (resources/ of waybar 0.16), the default bar of the Bar page. One path
# each, so scripts/debian-copyright.sh lists them.
[[annotations]]
path = "crates/core/src/bar/waybar-default/config.jsonc"
precedence = "override"
SPDX-FileCopyrightText = "2025 Alex"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "crates/core/src/bar/waybar-default/style.css"
precedence = "override"
SPDX-FileCopyrightText = "2025 Alex"
SPDX-License-Identifier = "MIT"

# The wallpaper photos belong to their photographers: they may only be used as wallpapers with Sway Things.
[[annotations]]
path = "wallpapers/niko-burkert/**"
precedence = "override"
SPDX-FileCopyrightText = ["2023 Niko Burkert", "2026 Niko Burkert"]
SPDX-License-Identifier = "LicenseRef-Sway-Things-Wallpapers"

[[annotations]]
path = "wallpapers/christoph-schmid/**"
precedence = "override"
SPDX-FileCopyrightText = [
  "2022 Christoph Schmid",
  "2024 Christoph Schmid",
  "2025 Christoph Schmid",
  "2026 Christoph Schmid",
]
SPDX-License-Identifier = "LicenseRef-Sway-Things-Wallpapers"
