version = 1

[[annotations]]
path = [
  "**.md",
  "**.yml",
  "**.yaml",
  "**.json",
  "**.toml",
  "Cargo.lock",
  "fuzz/Cargo.lock",
  "tools/requirements.*",
  ".gitignore",
  ".gitattributes",
  ".editorconfig",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The gettext template and translations start with the header gettext writes.
[[annotations]]
path = "po/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The man pages and shell completions are generated by crates/cli-docs and kept as it writes them; the zsh completion
# must start with #compdef.
[[annotations]]
path = ["data/man/**", "data/completions/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Generated sway config files start with the fixed header of Sway Things, not with an SPDX header.
[[annotations]]
path = "ci/integration/generated/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = ["Contributor Covenant contributors", "2026 Sway Things contributors"]
SPDX-License-Identifier = "CC-BY-4.0"

# Fuzzer seeds are inputs, so they stay without a header.
[[annotations]]
path = "fuzz/seeds/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Screenshots of the app for the website, made by scripts/update-website-screenshots.sh.
[[annotations]]
path = "website/src/assets/screenshots/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sway Things contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
