bindsym --no-warn Mod4+Return nop
unbindsym Mod4+Return
bindsym --locked --no-warn XF86AudioMute nop
unbindsym --locked XF86AudioMute
bindsym --locked --no-warn XF86AudioRaiseVolume exec "swayosd-client --output-volume raise"
bindsym --locked --no-warn XF86AudioLowerVolume exec "swayosd-client --output-volume lower"
bindsym --locked --no-warn XF86AudioMute exec "swayosd-client --output-volume mute-toggle"
bindsym --locked --no-warn XF86AudioMicMute exec "swayosd-client --input-volume mute-toggle"
bindsym --locked --no-warn XF86MonBrightnessUp exec "brightnessctl set 5%+"
bindsym --locked --no-warn XF86MonBrightnessDown exec "brightnessctl --min-value=1 set 5%-"
bindsym --locked --no-warn XF86AudioPlay exec "swayosd-client --playerctl play-pause"
bindsym --locked --no-warn XF86AudioPause exec "swayosd-client --playerctl play-pause"
bindsym --locked --no-warn XF86AudioNext exec "swayosd-client --playerctl next"
bindsym --locked --no-warn XF86AudioPrev exec "swayosd-client --playerctl prev"
bindsym --locked --no-warn XF86AudioStop exec "swayosd-client --playerctl stop"
bindsym Mod1+Return exec "foot"
bindsym --to-code --no-repeat Mod1+Shift+p exec 'notify-send "a b" $$HOME'
bindcode --release Mod4+38 focus left
