# Generated by Sway Things from ~/.config/sway-things/settings.toml. DO NOT EDIT.
# Change settings in the app or with `sway-things set`. Hand edits are overwritten.
bar sway-things mode hide
bar sway-things modifier Mod1
bar sway-things position bottom
bar sway-things height 28
bar sway-things output *
bar sway-things output "HEADLESS-1"
bar sway-things output "Dell \"U2415\" $$1"
bar sway-things font "pango:Noto Sans Bold 11"
bar sway-things colors background #202020e0
bar sway-things colors statusline #ffffff
bar sway-things colors focused_workspace #3b6e4f #3b6e4f #ffffff
bar sway-things colors active_workspace #00000033 #00000033 #ffffff
bar sway-things colors inactive_workspace #202020e0 #202020e0 #ffffff
bar sway-things colors urgent_workspace #eb4d4b #eb4d4b #ffffff
bar sway-things colors binding_mode #3b6e4f #3b6e4f #ffffff
bar sway-things status_command "while date +'%Y-%m-%d %X $$USER \"now\"'; do sleep 1; done"
