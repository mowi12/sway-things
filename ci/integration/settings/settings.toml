# Sample settings for the generator tests: crates/core/tests/generate_fixtures.rs turns them into the files in
# ../generated/, and scripts/check-integration.sh feeds those to a real sway.

version = 1

[input.pointer]
accel_profile = "flat"
scroll_method = "on_button_down"
scroll_button = "button8"
left_handed = true

[input.touchpad]
tap = true
pointer_accel = 0.3
natural_scroll = true
scroll_factor = 0.5
drag_lock = "enabled_sticky"
click_method = "clickfinger"

[input.keyboard]
repeat_delay = 300
xkb_layout = ["us", "de"]

[windows]
font = "Noto Sans 11"

[windows.gaps]
inner = 8

[windows.focused]
text = "#eeeeee"
child_border = "#3b6e4f"

[effects]
corner_radius = 8

[behavior]
focus_follows_mouse = "always"
workspace_layout = "tabbed"

[app]
safety_net_timeout = 20
