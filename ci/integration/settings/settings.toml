# Sample settings for the generator tests: crates/core/tests/generate_fixtures.rs turns them into the files in
# ../generated/, and scripts/check-integration.sh feeds those to a real sway.

version = 1

[input.pointer]
accel_profile = "flat"
scroll_method = "on_button_down"
scroll_button = "button8"
left_handed = true

[input.touchpad]
tap = true
pointer_accel = 0.3
natural_scroll = true
scroll_factor = 0.5
drag_lock = "enabled_sticky"
click_method = "clickfinger"

[input.keyboard]
xkb_layout = ["us", "de"]
xkb_variant = ["", "nodeadkeys"]
xkb_model = "pc104"
xkb_options = ["caps:escape", "compose:ralt"]
repeat_delay = 300
repeat_rate = 30
xkb_numlock = true
xkb_capslock = false

[windows]
font = "Noto Sans 11"
title_align = "center"
hide_edge_borders = "both"
hide_lone_tab = true
smart_borders = "no_gaps"
smart_gaps = "on"

[windows.gaps]
inner = 8
outer = -2

[windows.focused]
text = "#eeeeee"
child_border = "#3b6e4f"

[windows.focused_inactive]
border = "#444444"

[windows.unfocused]
text = "#999999"

[windows.urgent]
background = "#aa0000"

[windows.focused_tab_title]
background = "#335577"

[windows.border]
style = "pixel"
width = 3

[windows.floating_border]
style = "none"

# The thickness fits sway's default vertical padding of 4, then the padding fits the thickness.
[windows.titlebar]
border_thickness = 2
padding_horizontal = 8
padding_vertical = 3

[effects]
corner_radius = 8
smart_corner_radius = false
blur = true
blur_passes = 2
blur_noise = 0.05
shadows = true
shadow_color = "#00000080"
shadow_offset_x = 2.0
shadow_offset_y = -1.5
dim_inactive = 0.2
animation_duration_ms = 200

[effects.dim_inactive_colors]
urgent = "#880000"

[behavior]
focus_follows_mouse = "always"
mouse_warping = "container"
focus_wrapping = "workspace"
focus_on_window_activation = "smart"
workspace_layout = "tabbed"
default_orientation = "vertical"
workspace_auto_back_and_forth = true
tiling_drag = true
tiling_drag_threshold = 20
popup_during_fullscreen = "leave_fullscreen"
inhibit_idle_fullscreen = true
xwayland = "disable"

[behavior.floating_modifier]
key = "Mod4"
buttons = "inverse"

[behavior.floating_minimum_size]
mode = "none"

[behavior.floating_maximum_size]
mode = "custom"
width = 1600
height = 900

[app]
safety_net_timeout = 20
