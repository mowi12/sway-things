# The host overlay of the sample settings: it wins over settings.toml, and holds the values for one device and for
# outputs, which aren't connected in the headless session.

version = 1

[windows.gaps]
inner = 6

[device."1267:12377:ELAN1300:00_04F3:3059_Touchpad".input.touchpad]
tap = false
dwt = false

[device."1:1:AT_Translated_Set_2_keyboard".input.keyboard]
xkb_layout = ["fr", "us"]
xkb_variant = ["bepo"]
xkb_options = []

[display."Fake Make Co.,Ltd Model 0x1".output]
mode = "2560x1440@59.951Hz"
scale = 1.25
transform = "90"
position = "1920,0"

[display."DP-99".output]
enabled = false

[bar]
outputs = ["HEADLESS-1", "Dell \"U2415\" $1"]
