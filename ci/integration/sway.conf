# The kinds of directives Sway Things generates. Every supported sway must accept them.

set $mod Mod4

input type:keyboard {
    xkb_layout us,de
    xkb_options grp:alt_shift_toggle,caps:escape
    repeat_delay 300
    repeat_rate 30
}
input type:touchpad {
    tap enabled
    natural_scroll enabled
    pointer_accel 0.2
}
seat * hide_cursor 5000

default_border pixel 2
gaps inner 8
client.focused #4c7899 #285577 #ffffff #2e9ef4 #285577
focus_follows_mouse no

bindsym $mod+Return exec true
bindsym --locked XF86AudioMute exec true

# Generated by the command builders: hostile strings, and every input option.
include escaping.conf
include input.conf
