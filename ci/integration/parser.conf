# Constructs the config parser must read like sway does. Every mode defined here must be found by the parser, under
# the name and in the order sway reports over IPC (crates/core/tests/sway_config_sway.rs).

# A variable is replaced when the line is read: the later `set` doesn't rename the mode.
set $first one
mode $first {
    bindsym a nop
}
set $first two

# A brace on the next line, and a quoted name with a variable in it.
mode "$first words"

{
    bindsym a nop
}

# A continued line.
mode con\
tinued {
    bindsym a nop
}

# The longer variable name wins over its prefix.
set $long x
set $longer y
mode $longer$long {
    bindsym a nop
}

# The command itself in a variable.
set $command mode
$command from-variable {
    bindsym a nop
}

# A glob in sorted order, relative to this file; a.conf includes a file of its own.
include parser.d/*.conf
# Already read: sway skips it.
include parser.d/b.conf
# A path that doesn't exist, and a quoted path.
include parser.d/missing.conf
include "parser.d/nested/d.conf"

# A variable set in an included file is known here.
mode after-$included {
    bindsym a nop
}
