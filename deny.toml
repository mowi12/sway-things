[graph]
all-features = true

[licenses]
# Licenses compatible with GPL-3.0-or-later.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "GPL-2.0-or-later",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
ignore = true

# Unmaintained, not vulnerable: zbus 6 merged these crates into itself, but it needs Rust 1.89 and the MSRV is 1.85,
# so zbus 5 still depends on them. Drop the ignores once the MSRV allows zbus 6.
[advisories]
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained, merged into zbus 6, which needs Rust 1.89" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained, merged into zbus 6, which needs Rust 1.89" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained, merged into zbus 6, which needs Rust 1.89" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# libFuzzer, which the fuzz crate (fuzz/) links, is under LLVM's NCSA license, compatible with GPL-3.0-or-later.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]
