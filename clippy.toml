allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# Product names that doc_markdown would otherwise ask to put in backticks; ".." keeps clippy's defaults.
doc-valid-idents = [
  "SwayFX",
  "BlueZ",
  "UPower",
  "NetworkManager",
  "OpenVPN",
  "OpenConnect",
  "WireGuard",
  "GSettings",
  "PulseAudio",
  "PipeWire",
  "WirePlumber",
  "SwayOSD",
  "..",
]
