[package]
name = "sway-things-gui"
description = "GTK4 settings app for sway and SwayFX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-channel.workspace = true
futures-lite.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
sway-things-core = { path = "../core" }

[build-dependencies]
glib-build-tools.workspace = true

[dev-dependencies]
async-io.workspace = true
sway-things-core = { path = "../core", features = ["test-support"] }
tempfile.workspace = true
zbus.workspace = true

[[test]]
name = "gui"
# GTK runs on one thread: the test is a plain program that runs its checks in order.
harness = false

[[test]]
name = "gui_pseudo"
harness = false
