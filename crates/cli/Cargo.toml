[package]
name = "sway-things-cli"
description = "Command-line interface of Sway Things"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sway-things"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
async-channel.workspace = true
async-io.workspace = true
clap.workspace = true
futures-lite.workspace = true
serde_json.workspace = true
sway-things-core = { path = "../core" }

[dev-dependencies]
sway-things-core = { path = "../core", features = ["test-support"] }
tempfile.workspace = true
