# The violations of the architecture rules that are accepted until they are repaired: one entry per rule and edge, with
# the reason and the planned repair in `why`. The test fails on a violation that isn't listed and on an entry that no
# longer occurs. Rewrite it with `SWAY_THINGS_UPDATE_BASELINE=1 cargo test -p sway-things-architecture`, then replace
# every placeholder `why` with the reason; see wiki/Testing.md, "Architecture tests".

[[violation]]
rule = "R2-file-cycles"
from = "cli::displays"
to = "cli::hook"
why = "`displays` reuses `hook::kanshi_files`, and the hook runs `wallpaper`, which uses `displays`: the kanshi file helper moves into `displays` or a module of its own."

[[violation]]
rule = "R2-file-cycles"
from = "cli::hook"
to = "cli::wallpaper"
why = "The hook dispatches to `wallpaper::hook_wallpaper`; the cycle ends when `displays` no longer uses `hook` (see that entry)."

[[violation]]
rule = "R2-file-cycles"
from = "cli::wallpaper"
to = "cli::displays"
why = "`wallpaper` lists the displays through `displays::Displays`; the cycle ends when `displays` no longer uses `hook` (see that entry)."

[[violation]]
rule = "R2-file-cycles"
from = "gui::app"
to = "gui::window"
why = "The application builds the window; the cycle ends when the widgets stop reaching the window and the app (see the `gui::widgets` entries)."

[[violation]]
rule = "R2-file-cycles"
from = "gui::widgets::apps"
to = "gui::widgets::shortcuts"
why = "The Apps page reuses the key helpers of Keyboard Shortcuts (`GdkKeymap`, `clash_line`, `place`); on the cycle only through `widgets::shortcuts` → `window`; it ends when the widgets stop downcasting `root()` to `Window` (see those entries)."

[[violation]]
rule = "R2-file-cycles"
from = "gui::widgets::bar::files"
to = "gui::window"
why = "The Bar page's files row downcasts `root()` to `Window` to open the generated config; it ends when the widgets stop downcasting `root()` to `Window` (see those entries)."

