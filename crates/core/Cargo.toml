[package]
name = "sway-things-core"
description = "Settings registry, state, generators and sway integration of Sway Things"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The stand-in for sway in `ipc::stand_in`, for the tests of the crates built on the core.
test-support = ["dep:tempfile"]

[dependencies]
async-channel.workspace = true
async-io.workspace = true
async-process.workspace = true
futures-lite.workspace = true
notify.workspace = true
roxmltree.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
swayipc-types.workspace = true
tempfile = { workspace = true, optional = true }
toml_edit.workspace = true

[dev-dependencies]
proptest.workspace = true
regex.workspace = true
tempfile.workspace = true
