# Fields: name; color (6 lowercase hex digits, no #); description (1 to 100 characters);
# aliases (optional): old names. A label with an old name gets renamed, so issues keep it.
# Each group has its own hue; the shade within a group carries meaning (see the group comments).

# area: which part of the code base. Purple, darker = lower layer
- name: "area:core"
  color: "3e1f79"
  description: "crates/core: registry, state, generators, parser, IPC, backends"
- name: "area:cli"
  color: "6639ba"
  description: "crates/cli: the sway-things command"
- name: "area:gui"
  color: "8250df"
  description: "crates/gui: app shell and pages"
- name: "area:packaging"
  color: "c297ff"
  description: "OBS, AUR, release tarballs, desktop and AppStream files"
- name: "area:ci"
  color: "ecd8ff"
  description: "Workflows, checks and scripts"
- name: "area:website"
  color: "e2d0fb"
  description: "website/: the project site at sway-things.org"

