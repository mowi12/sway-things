# status: why an issue can't move right now. Gray, darker = more stuck
- name: "status:blocked"
  color: "424a53"
  description: "Waiting on another issue or upstream"
- name: "status:needs-decision"
  color: "6e7781"
  description: "The maintainers have to decide before work starts"
- name: "status:needs-info"
  color: "afb8c1"
  description: "Waiting for more information from the reporter"

# compat: compositor compatibility. Brown
- name: "compat:swayfx"
  color: "795548"
  description: "Concerns SwayFX-specific behavior"

# GitHub's own labels, recognized by its contributor features. Pink
- name: "good first issue"
