name: External Links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  external:
    name: Check External Links
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lychee
        env:
          GH_TOKEN: ${{ github.token }}
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          gh release download "lychee-v$LYCHEE_VERSION" --repo lycheeverse/lychee \
            --pattern lychee-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/lychee.tar.gz"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --quiet
          mkdir "$RUNNER_TEMP/lychee"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee" --strip-components 1 \
            lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP/lychee" >> "$GITHUB_PATH"
      - name: Check External Links
        id: check
        shell: bash
        run: scripts/check-links.sh --external | tee "$RUNNER_TEMP/links.md"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Report Dead Links
        if: failure() && steps.check.outcome == 'failure'
        run: scripts/report-dead-links.sh "$RUNNER_TEMP/links.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
