name: External Links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  external:
    name: Check External Links
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lychee
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-tool.sh lychee
      - name: Check External Links
        id: check
        shell: bash
        run: scripts/check-links.sh --external | tee "$RUNNER_TEMP/links.md"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Report Dead Links
        if: failure() && steps.check.outcome == 'failure'
        run: scripts/report-dead-links.sh "$RUNNER_TEMP/links.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
