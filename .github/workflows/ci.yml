name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Check Formatting
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Install dprint
        env:
          GH_TOKEN: ${{ github.token }}
          DPRINT_VERSION: 0.64.3
          DPRINT_SHA256: f71cb7e22d6776439eba168d5cb296092d6413fea7148fe4d70684a2702a4fee
        run: |
          gh release download "$DPRINT_VERSION" --repo dprint/dprint \
            --pattern dprint-x86_64-unknown-linux-gnu.zip --output "$RUNNER_TEMP/dprint.zip"
          echo "$DPRINT_SHA256  $RUNNER_TEMP/dprint.zip" | sha256sum --check --quiet
          unzip -q "$RUNNER_TEMP/dprint.zip" -d "$RUNNER_TEMP/dprint"
          echo "$RUNNER_TEMP/dprint" >> "$GITHUB_PATH"
      - name: Check Formatting
        run: scripts/check-fmt.sh

  clippy:
    name: Lint Rust
    runs-on: ubuntu-24.04
    # Debian 13 has GTK 4.18, the oldest the app supports; Ubuntu 24.04 has 4.14.
    container: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Build Dependencies
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends ca-certificates rustup gcc libc6-dev pkgconf libgtk-4-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - name: Lint Rust
        run: scripts/check-clippy.sh

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install markdownlint-cli2
        run: npm ci --prefix tools --no-audit --no-fund
      - name: Lint Markdown
        run: scripts/check-markdown.sh

  workflows:
    name: Lint Workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint \
            --pattern "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --quiet
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Lint Workflows
        run: scripts/check-workflows.sh

  shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Shell Scripts
        run: scripts/check-shell.sh

  metadata:
    name: Validate Metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gettext and Validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends gettext desktop-file-utils appstream
      - name: Validate Metadata
        run: scripts/check-metadata.sh

  pot:
    name: Check Translation Template
    runs-on: ubuntu-24.04
    # xgettext reads Rust from gettext 0.24 on; Debian 13 and Ubuntu 24.04 have older versions.
    container: archlinux:base@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9
    permissions:
      contents: read
    steps:
      - name: Install gettext and diffutils
        run: pacman -Syu --noconfirm --needed gettext diffutils
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Translation Template
        run: scripts/check-pot.sh

  spelling:
    name: Check Spelling
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install typos
        env:
          GH_TOKEN: ${{ github.token }}
          TYPOS_VERSION: 1.51.1
          TYPOS_SHA256: 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454
        run: |
          gh release download "v$TYPOS_VERSION" --repo crate-ci/typos \
            --pattern "typos-v$TYPOS_VERSION-x86_64-unknown-linux-musl.tar.gz" --output "$RUNNER_TEMP/typos.tar.gz"
          echo "$TYPOS_SHA256  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check --quiet
          mkdir "$RUNNER_TEMP/typos"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos" ./typos
          echo "$RUNNER_TEMP/typos" >> "$GITHUB_PATH"
      - name: Check Spelling
        run: scripts/check-spelling.sh

  licenses:
    name: Check Licenses
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install reuse
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet --require-hashes --no-deps -r tools/requirements.txt
          echo "$RUNNER_TEMP/reuse/bin" >> "$GITHUB_PATH"
      - name: Check Licenses
        run: scripts/check-licenses.sh

  links:
    name: Check Links
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lychee
        env:
          GH_TOKEN: ${{ github.token }}
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          gh release download "lychee-v$LYCHEE_VERSION" --repo lycheeverse/lychee \
            --pattern lychee-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/lychee.tar.gz"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --quiet
          mkdir "$RUNNER_TEMP/lychee"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee" --strip-components 1 \
            lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP/lychee" >> "$GITHUB_PATH"
      - name: Check Links
        run: scripts/check-links.sh

  deps:
    name: Check Dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          gh release download "$CARGO_DENY_VERSION" --repo EmbarkStudios/cargo-deny \
            --pattern "cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            --output "$RUNNER_TEMP/cargo-deny.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check --quiet
          mkdir "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/cargo-deny" --strip-components 1 \
            "cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
          echo "$RUNNER_TEMP/cargo-deny" >> "$GITHUB_PATH"
      - name: Check Dependencies
        run: scripts/check-deps.sh

  tests:
    name: Run Tests (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    # Debian 13 has GTK 4.18, the oldest the app supports; Ubuntu 24.04 has 4.14.
    container: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85", stable]
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Build Dependencies
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends ca-certificates rustup gcc libc6-dev pkgconf libgtk-4-dev
      - name: Install Rust
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$TOOLCHAIN"
      - name: Run Tests
        run: scripts/check-tests.sh

  install:
    name: Check Install
    runs-on: ubuntu-24.04
    # The distribution the tests build on: Debian 13 has GTK 4.18, the oldest the app supports.
    container: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Build Dependencies
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends ca-certificates rustup gcc libc6-dev pkgconf libgtk-4-dev \
            gettext desktop-file-utils appstream groff-base zsh fish
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Check Install
        run: scripts/check-install.sh

  fuzz:
    name: Fuzz Config Parser
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - name: Install cargo-fuzz
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_FUZZ_VERSION: 0.13.2
          CARGO_FUZZ_SHA256: b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c
        run: |
          gh release download "$CARGO_FUZZ_VERSION" --repo rust-fuzz/cargo-fuzz \
            --pattern "cargo-fuzz-$CARGO_FUZZ_VERSION-x86_64-unknown-linux-musl.tar.gz" --output "$RUNNER_TEMP/cargo-fuzz.tar.gz"
          echo "$CARGO_FUZZ_SHA256  $RUNNER_TEMP/cargo-fuzz.tar.gz" | sha256sum --check --quiet
          mkdir "$RUNNER_TEMP/cargo-fuzz"
          tar -xzf "$RUNNER_TEMP/cargo-fuzz.tar.gz" -C "$RUNNER_TEMP/cargo-fuzz" cargo-fuzz
          echo "$RUNNER_TEMP/cargo-fuzz" >> "$GITHUB_PATH"
      - name: Install cargo-deny
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          gh release download "$CARGO_DENY_VERSION" --repo EmbarkStudios/cargo-deny \
            --pattern "cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            --output "$RUNNER_TEMP/cargo-deny.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check --quiet
          mkdir "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/cargo-deny" --strip-components 1 \
            "cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
          echo "$RUNNER_TEMP/cargo-deny" >> "$GITHUB_PATH"
      - name: Lint Fuzz Crate
        run: scripts/fuzz.sh lint
      - name: Fuzz Config Parser
        id: fuzz
        run: scripts/fuzz.sh run 60
      - name: Upload Fuzz Inputs
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-inputs
          path: fuzz/artifacts/sway_config/
          if-no-files-found: ignore

  packaging:
    name: Check Packaging
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Packaging
        run: scripts/check-packaging.sh

  commits:
    name: Check Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-commits.sh "origin/$BASE_REF"

  integration:
    name: Run Integration Tests (${{ matrix.compositor }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compositor: [sway-1.10, sway-latest, swayfx]
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provide a Virtual Render Node
        if: matrix.compositor == 'swayfx'
        run: |
          if ! sudo modprobe vgem; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe vgem
          fi
          ls -l /dev/dri
      - name: Run Integration Tests
        env:
          COMPOSITOR: ${{ matrix.compositor }}
        run: scripts/check-integration.sh --container "$COMPOSITOR"
