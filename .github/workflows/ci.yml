name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Check Formatting
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Install dprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-tool.sh dprint
      - name: Check Formatting
        run: scripts/check-fmt.sh

  clippy:
    name: Lint Rust
    runs-on: ubuntu-24.04
    # Debian 13 has GTK 4.18, the oldest the app supports; Ubuntu 24.04 has 4.14.
    container: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Build Dependencies
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends ca-certificates rustup gcc libc6-dev pkgconf libgtk-4-dev libgtk4-layer-shell-dev libpulse-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - name: Lint Rust
        run: scripts/check-clippy.sh

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install markdownlint-cli2
        run: npm ci --prefix tools --no-audit --no-fund
      - name: Lint Markdown
        run: scripts/check-markdown.sh

  workflows:
    name: Lint Workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-tool.sh actionlint
      - name: Lint Workflows
        run: scripts/check-workflows.sh

  shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Shell Scripts
        run: scripts/check-shell.sh

  install-script:
    name: Check Install Script
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Install Script
        run: scripts/check-install-from-obs.sh

  metadata:
    name: Validate Metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gettext and Validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends gettext desktop-file-utils appstream
      - name: Validate Metadata
        run: scripts/check-metadata.sh

  pot:
    name: Check Translation Template
    runs-on: ubuntu-24.04
    # xgettext reads Rust from gettext 0.24 on; Debian 13 and Ubuntu 24.04 have older versions.
    container: archlinux:base@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9
    permissions:
      contents: read
    steps:
      - name: Install gettext and diffutils
        run: pacman -Syu --noconfirm --needed gettext diffutils
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Translation Template
        run: scripts/check-pot.sh

  spelling:
    name: Check Spelling
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install typos
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-tool.sh typos
      - name: Check Spelling
        run: scripts/check-spelling.sh

  licenses:
    name: Check Licenses
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install reuse
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet --require-hashes --no-deps -r tools/requirements.txt
          echo "$RUNNER_TEMP/reuse/bin" >> "$GITHUB_PATH"
      - name: Check Licenses
        run: scripts/check-licenses.sh

  links:
    name: Check Links
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lychee
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-tool.sh lychee
      - name: Check Links
        run: scripts/check-links.sh

  website:
    name: Check Website
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Check Tools
        run: npm ci --prefix tools --no-audit --no-fund
      - name: Install Website Packages
        run: npm ci --prefix website --no-audit --no-fund
      - name: Install lychee
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-tool.sh lychee
      - name: Check npm Licenses
        run: scripts/check-npm-licenses.sh
      - name: Check Website
        run: scripts/check-website.sh
      # The runner image has Google Chrome.
      - name: Check Website Performance
        run: scripts/check-website-performance.sh
        env:
          CHROME_PATH: /usr/bin/google-chrome

  deps:
    name: Check Dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-tool.sh cargo-deny
      - name: Check Dependencies
        run: scripts/check-deps.sh

  tests:
    name: Run Tests (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    # Debian 13 has GTK 4.18, the oldest the app supports; Ubuntu 24.04 has 4.14.
    container: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85", stable]
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Build Dependencies
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends ca-certificates rustup gcc libc6-dev pkgconf libgtk-4-dev libgtk4-layer-shell-dev libpulse-dev
      - name: Install Rust
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$TOOLCHAIN"
      - name: Run Tests
        run: scripts/check-tests.sh

  install:
    name: Check Install
    runs-on: ubuntu-24.04
    # The distribution the tests build on: Debian 13 has GTK 4.18, the oldest the app supports.
    container: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Build Dependencies
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends ca-certificates rustup gcc libc6-dev pkgconf libgtk-4-dev libgtk4-layer-shell-dev libpulse-dev \
            gettext desktop-file-utils appstream groff-base zsh fish
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Check Install
        run: scripts/check-install.sh

  fuzz:
    name: Fuzz Config Parser
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends pkgconf libglib2.0-dev libpulse-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - name: Install cargo-fuzz
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-tool.sh cargo-fuzz
      - name: Install cargo-deny
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-tool.sh cargo-deny
      - name: Lint Fuzz Crate
        run: scripts/fuzz.sh lint
      - name: Fuzz Config Parser
        id: fuzz
        run: scripts/fuzz.sh run 60
      - name: Upload Fuzz Inputs
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-inputs
          path: fuzz/artifacts/sway_config/
          if-no-files-found: ignore

  packaging:
    name: Check Packaging
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Packaging
        run: scripts/check-packaging.sh

  commits:
    name: Check Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-commits.sh "origin/$BASE_REF"

  integration:
    name: Run Integration Tests (${{ matrix.compositor }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compositor: [sway-1.10, sway-latest, swayfx]
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provide a Virtual Render Node
        if: matrix.compositor == 'swayfx'
        run: |
          if ! sudo modprobe vgem; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe vgem
          fi
          ls -l /dev/dri
      - name: Run Integration Tests
        env:
          COMPOSITOR: ${{ matrix.compositor }}
        run: scripts/check-integration.sh --container "$COMPOSITOR"
