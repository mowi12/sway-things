name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Check Formatting
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Install dprint
        env:
          DPRINT_VERSION: 0.64.3
          DPRINT_SHA256: f71cb7e22d6776439eba168d5cb296092d6413fea7148fe4d70684a2702a4fee
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dprint.zip" \
            "https://github.com/dprint/dprint/releases/download/$DPRINT_VERSION/dprint-x86_64-unknown-linux-gnu.zip"
          echo "$DPRINT_SHA256  $RUNNER_TEMP/dprint.zip" | sha256sum --check --quiet
          unzip -q "$RUNNER_TEMP/dprint.zip" -d "$RUNNER_TEMP/dprint"
          echo "$RUNNER_TEMP/dprint" >> "$GITHUB_PATH"
      - name: Check Formatting
        run: scripts/check-fmt.sh

  clippy:
    name: Lint Rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - name: Lint Rust
        run: scripts/check-clippy.sh

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install markdownlint-cli2
        run: npm ci --prefix tools --no-audit --no-fund
      - name: Lint Markdown
        run: scripts/check-markdown.sh

  workflows:
    name: Lint Workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --quiet
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Lint Workflows
        run: scripts/check-workflows.sh
