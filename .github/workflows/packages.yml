name: Packages

# Builds the distribution packages in clean containers, from the release tarball as the openSUSE Build Service gets it.
# Not a check on pull requests: the builds take long. A break shows up here right after the merge, or in the weekly run
# that catches changes in the distributions. The release workflow calls it with the tarball of the tag.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact:
        description: The workflow artifact with the tarball and the specs of scripts/make-tarball.sh; made here if empty
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tarball:
    name: Make Tarball
    if: inputs.artifact == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The snapshot version counts the commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Make Tarball Twice
        run: scripts/make-tarball.sh --check --out "$RUNNER_TEMP/dist"
      - name: Upload Tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build Package (${{ matrix.name }})
    needs: tarball
    if: ${{ !cancelled() && (needs.tarball.result == 'success' || needs.tarball.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        name: [opensuse-tumbleweed, fedora, debian-13, ubuntu-26.04]
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact || 'tarball' }}
          path: ${{ runner.temp }}/dist
      - name: Build Package
        env:
          NAME: ${{ matrix.name }}
        run: |
          tarball=("$RUNNER_TEMP"/dist/sway-things-*.tar.xz)
          scripts/build-packages.sh --container "$NAME" --tarball "${tarball[0]}"
