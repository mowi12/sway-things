name: Bug Report
description: Something in Sway Things doesn't work as intended
type: Bug

body:
  - type: checkboxes
    id: existing-issue
    attributes:
      label: Is there an existing issue for this?
      description: Please check whether this bug has already been reported.
      options:
        - label: I have searched the existing issues
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug. Which page or command?
      placeholder: e.g. "Changing the touchpad scroll speed has no effect after a sway reload."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Mouse & Touchpad page
        2. Change '...'
        3. Run `swaymsg reload`
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
      placeholder: e.g. "The new scroll speed is kept."
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `sway-things doctor`
      description: It starts with the system details (the versions of Sway Things, the compositor, GTK, the distribution, …) and checks the setup and conflicts. Without a terminal, use "Copy System Details" on the About & Maintenance page instead. Remove anything you consider private.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: |
        Relevant lines of your sway config, logs, screenshots, or other context that helps us debug the issue.

        Tip: You can drag and drop files here.
    validations:
      required: false
