version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Don't propose versions younger than a week; security updates are exempt.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["area:ci"]

  - package-ecosystem: cargo
    # fuzz/ is a workspace of its own, with its own Cargo.lock.
    directories: ["/", "/fuzz"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    labels: []

  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["area:ci"]

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["area:ci"]

  - package-ecosystem: docker
    directories: ["/ci/containers/*", "/ci/packages/*"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["area:ci"]
