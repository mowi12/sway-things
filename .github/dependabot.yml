version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Don't propose versions younger than a week; security updates are exempt.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["area:ci"]

  - package-ecosystem: cargo
    # fuzz/ is a workspace of its own, with its own Cargo.lock.
    directories: ["/", "/fuzz"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    labels: []

  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["area:ci"]

  # The website's build tools; nothing from them is published but the built site.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      website:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    labels: ["area:website"]

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["area:ci"]

  - package-ecosystem: docker
    directories: ["/ci/containers/*", "/ci/packages/*"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["area:ci"]

  # The images of the workflows and of scripts/check-install-from-obs.sh, whose versions are chosen by hand: Fedora is
  # the newest release with packages on OBS, so only its digest is updated.
  - package-ecosystem: docker
    directory: /ci/images
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: fedora
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["area:ci"]
