version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Don't propose versions younger than a week; security updates are exempt.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["kind:maintenance", "area:ci"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    labels: ["kind:maintenance"]

  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["kind:maintenance", "area:ci"]
